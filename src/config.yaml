# Maize Seed Classifier Configurations

# Dataset Paths
dataset_a_dir: "MaizeData 2"
dataset_b_dir: "Lightweight Dataset for Maize Classification on Resource-Constrained Devices/EfficientMaize"

# Preprocessing & Model Params
image_size: 224
cnn_backbone: "resnet50"                    # Options: resnet50, efficientnetv2_s
vit_backbone: "vit_small_patch16_224"        # Options: vit_small_patch16_224, swin_tiny
embed_dim: 256
num_heads: 8
device: "mps"                                # Use mps for Mac GPU, fallback to cpu in code if not available

# Phase 1: Pretraining (Variety Classification on Dataset A)
phase1:
  batch_size: 16
  epochs: 15
  lr: 0.001
  weight_decay: 0.0001
  checkpoint_dir: "checkpoints/phase1"

# Phase 2: Finetuning (Quality Classification on Dataset B)
phase2:
  batch_size: 16
  epochs: 10
  frozen_epochs: 3                           # Number of epochs where backbone is frozen
  lr_head: 0.001                             # Learning rate for classification head
  lr_finetune: 0.0001                        # Learning rate for end-to-end finetuning
  weight_decay: 0.0001
  cv_folds: 5                                # 5-fold cross validation
  checkpoint_dir: "checkpoints/phase2"
