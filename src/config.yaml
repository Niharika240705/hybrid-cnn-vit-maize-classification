# Maize Seed Classifier Configurations

# Dataset Paths
dataset_a_dir: "data/MaizeData 2"
dataset_b_dir: "data/Lightweight Dataset for Maize Classification on Resource-Constrained Devices/EfficientMaize"

# Preprocessing & Model Params
image_size: 224
cnn_backbone: "resnet50" # Options: resnet50, efficientnetv2_s
vit_backbone: "swin_tiny_patch4_window7_224" # Options: vit_small_patch16_224, swin_tiny
embed_dim: 256
num_heads: 8
device: "cuda" # Use NVIDIA CUDA GPU, fallback to CPU if unavailable

# Phase 1: Pretraining (Variety Classification on Dataset A)
phase1:
  batch_size: 16
  epochs: 15
  lr: 0.001
  weight_decay: 0.0001
  checkpoint_dir: "checkpoints/phase1"

# Phase 2: Finetuning (Quality Classification on Dataset B)
phase2:
  batch_size: 8
  epochs: 30
  frozen_epochs: 5
  lr_head: 0.0005
  lr_finetune: 0.00001
  weight_decay: 0.0001
  label_smoothing: 0.05
  use_class_weights: false
  cv_folds: 5 # 5-fold cross validation
  checkpoint_dir: "checkpoints/phase2"
